<!doctype html>

<style>
body{margin:0}

<div style="position: relative; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 72px; letter-spacing: 18px; padding-left: 18px; color: #F6F1DC;">KİRVE</div>
